name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make check
      - run: npm --prefix ios-client ci
      - run: npm --prefix ios-client run check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_USER: voxa_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: voxa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxa_test -d voxa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      VOXA_TEST_DATABASE_URL: postgresql://voxa_test:disposable-ci-password@127.0.0.1:5432/voxa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory backend --locked
      - run: uv run --directory backend --locked pytest -q tests/test_postgres.py tests/test_database_import.py
