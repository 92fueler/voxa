[project]
name = "voxa-backend"
version = "0.2.0"
description = "Local voice companion API with replaceable model providers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "websockets>=15",
    "python-dotenv>=1.1",
    "pydantic>=2.14",
]

[project.scripts]
voxa = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9",
    "pytest-asyncio>=1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = [".", "tests"]
python-interpreter-path = ".venv/bin/python"
disable-search-path-heuristics = true
